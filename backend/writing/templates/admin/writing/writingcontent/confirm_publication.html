{% extends "admin/base_site.html" %}
{% block content %}
<h1>{{ title }}</h1>
<p>确认后将按当前内容执行，编辑或发布状态发生变化时本批操作会失败。</p>
<form method="post" class="admin-actions mt-4">{% csrf_token %}
  {% for content in contents %}<input type="hidden" name="_selected_action" value="{{ content.pk }}">{% endfor %}
  <input type="hidden" name="action" value="{{ action_name }}">
  <input type="hidden" name="confirm_publication" value="{{ action_name }}">
  <input type="hidden" name="confirmation_token" value="{{ confirmation_token }}">
  <button type="submit" class="admin-action admin-action--{% if publishing %}primary{% else %}danger{% endif %}">确认{{ publishing|yesno:"发布,下架" }}</button>
  <a class="admin-action admin-action--secondary" href="{% url 'admin:writing_writingcontent_changelist' %}">取消并返回</a>
</form>
{% endblock %}
